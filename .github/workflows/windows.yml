name: Windows Build

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  msys2-64bit:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          bison diffutils flex git grep make sed
          mingw-w64-x86_64-binutils mingw-w64-x86_64-ca-certificates
          mingw-w64-x86_64-ccache mingw-w64-x86_64-curl-winssl
          mingw-w64-x86_64-gcc mingw-w64-x86_64-glib2
          mingw-w64-x86_64-libnfs mingw-w64-x86_64-libssh
          mingw-w64-x86_64-ninja mingw-w64-x86_64-pixman
          mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python
          mingw-w64-x86_64-python-certifi
          mingw-w64-x86_64-python-setuptools
          mingw-w64-x86_64-python-wheel mingw-w64-x86_64-zstd

    - name: Configure
      shell: msys2 {0}
      run: |
        mkdir build
        cd build
        ../configure --disable-system --enable-tools -Ddebug=false -Doptimization=0 --disable-werror

    - name: Build
      shell: msys2 {0}
      run: |
        cd build
        make -j$(nproc)

    - name: Test
      shell: msys2 {0}
      run: |
        cd build
        make check || true
  msys2-arm64:
    name: msys2-arm64
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4

    # MSYS2 has no GCC for ARM64 Windows; the native toolchain is clang in the
    # CLANGARM64 environment (/clangarm64). The packages below install into
    # /clangarm64, so the shell must be CLANGARM64 too. With MINGW64 the PATH
    # points at /mingw64/bin and none of these tools are found.
    - name: Setup MSYS2 (ARM64)
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANGARM64
        update: true
        install: >-
          bison diffutils flex git grep make sed
        pacboy: >-
          toolchain:p llvm-tools:p ccache:p curl-winssl:p glib2:p libnfs:p
          libssh:p ninja:p pixman:p pkgconf:p python:p python-certifi:p
          python-setuptools:p python-wheel:p zstd:p

    - name: Diagnose toolchain (ARM64)
      shell: msys2 {0}
      run: |
        echo "MSYSTEM=$MSYSTEM"
        echo "--- which ---"
        which clang clang++ ninja python windres || true
        clang --version
        clang++ --version

    - name: Configure (ARM64)
      shell: msys2 {0}
      env:
        CC: clang
        CXX: clang++
      run: |
        mkdir build
        cd build
        # qemu-ga (guest agent) needs GNU windmc, which the CLANGARM64 llvm
        # toolchain does not provide. It is not needed for this tools build.
        ../configure --cc=clang --cxx=clang++ --disable-system --enable-tools --disable-guest-agent -Ddebug=false -Doptimization=0 --disable-werror

    - name: Build (ARM64)
      shell: msys2 {0}
      run: |
        cd build
        make -j$(nproc)

    - name: Test (ARM64)
      shell: msys2 {0}
      run: |
        cd build
        make check || true
